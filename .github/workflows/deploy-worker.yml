name: Deploy the event-hog Worker

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'kit/**'
      - 'migrations/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    # The deployment's config and Cloudflare token live in this fork's secrets.
    if: github.repository == 'Edviro-YC/event-hog-mcp'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      # The real wrangler config (D1 id, URLs) stays out of this public repo:
      # it's the WRANGLER_CONFIG_B64 secret, base64 so it masks as one line.
      - name: Write the deployment's wrangler config
        env:
          WRANGLER_CONFIG_B64: ${{ secrets.WRANGLER_CONFIG_B64 }}
        run: |
          test -n "$WRANGLER_CONFIG_B64" || { echo "::error::Set the WRANGLER_CONFIG_B64 secret (README: Deploy on every push)."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Set the CLOUDFLARE_API_TOKEN secret (README: Deploy on every push)."; exit 1; }
          echo "$WRANGLER_CONFIG_B64" | base64 -d > wrangler.deploy.jsonc

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply CRM --remote -c wrangler.deploy.jsonc

      - name: Deploy
        run: npx wrangler deploy -c wrangler.deploy.jsonc --message "${GITHUB_SHA::7} ${GITHUB_REF_NAME}"
